[project]
name = "sre-agent-lab"
version = "0.1.0"
description = "Dataset-backed SRE agent evaluation lab"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.3,<2"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["sre_lab"]

[tool.coverage.report]
fail_under = 80
show_missing = true
