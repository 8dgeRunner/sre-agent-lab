apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-observer
  namespace: chaos-lab
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-observer
  namespace: chaos-lab
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-observer
  namespace: chaos-lab
subjects:
  - kind: ServiceAccount
    name: lab-observer
    namespace: chaos-lab
roleRef:
  kind: Role
  name: lab-observer
  apiGroup: rbac.authorization.k8s.io
