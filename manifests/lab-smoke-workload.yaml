apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-demo-payment
  namespace: chaos-lab
  labels:
    app.kubernetes.io/part-of: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-demo-payment
  template:
    metadata:
      labels:
        app: sre-demo-payment
        app.kubernetes.io/part-of: sre-demo
    spec:
      containers:
        - name: payment
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /tmp/www && echo payment-ok > /tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: chaos-lab
spec:
  selector:
    app: sre-demo-payment
  ports:
    - name: http
      port: 80
      targetPort: http
